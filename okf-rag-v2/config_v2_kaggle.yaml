  # A genuine unbounded runaway still hits the cap -> empty -> LLMError -> the
  # per-row skip in run_experiment logs it to skipped_<stem>_<arm>.json and the
  # run continues.
  max_tokens: 8000
  timeout_s: 600
  retries: 5

bundle_builder:
  # v2 REBUILD: same model as generation, NOT v1's llama3.1:8b.
